  <script>
    const tl = gsap.timeline({ paused: true });
    // Overlay-local times (s). Overlay starts at reel 00:07:15, so reel SS:FF = overlay + 7.5 s.
    const T = { sf: 1.167, sj: 2.2, eureka: 3.5, reno: 4.667, tracy: 5.733 };
    const order = ["sf", "sj", "eureka", "reno", "tracy"];
    const DRAW = { sj: 0.75, eureka: 0.95, reno: 0.85, tracy: 0.75 };

    tl.fromTo("#map-card", { scale: 0, rotation: -8 },
      { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1.6)" }, 0);
    tl.fromTo("#map-stage", { scale: 1.0 }, { scale: 1.05, duration: 8.4, ease: "none" }, 0);
    tl.set(".pin .dot, .lbl", { scale: 0, opacity: 0 }, 0);
    tl.set(".ring", { opacity: 0 }, 0);
    tl.set("#map-glow path", { opacity: 0 }, 0);

    const head = document.querySelector("#map-head");
    order.forEach((k, i) => {
      const t = T[k];
      if (i > 0) {
        const d = DRAW[k], path = document.querySelector("#map-route-" + k);
        const len = path.getTotalLength() || 1, p = { v: 0 };
        tl.fromTo(path, { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t - d);
        tl.fromTo(p, { v: 0 }, { v: 1, duration: d, ease: "power2.inOut", onUpdate: () => {
          const pt = path.getPointAtLength(p.v * len); head.setAttribute("cx", pt.x); head.setAttribute("cy", pt.y);
        } }, t - d);
        tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t - d);
        tl.to(head, { opacity: 0, duration: 0.1 }, t - 0.05);
        // previous label steps back to cream
        tl.to("#map-lbl-" + order[i - 1], { backgroundColor: "rgba(209,159,40,0)", color: "#fbf7ef", duration: 0.25 }, t);
      }
      tl.fromTo("#map-pin-" + k + " .dot", { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(3)", transformOrigin: "50% 50%" }, t);
      tl.fromTo("#map-ring-" + k, { scale: 1, opacity: 1 },
        { scale: 3.4, opacity: 0, duration: 0.8, ease: "power2.out", transformOrigin: "50% 50%" }, t);
      tl.fromTo("#map-lbl-" + k, { scale: 0.4, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
    });

    // Finale: every city pulses together, routes glow
    const fin = 6.35;
    tl.fromTo("#map-glow path", { opacity: 0 }, { opacity: 1, duration: 0.5 }, fin);
    tl.fromTo(".ring", { scale: 1, opacity: 1 },
      { scale: 3.4, opacity: 0, duration: 0.9, ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, fin);
    tl.to("#map-lbl-tracy", { backgroundColor: "rgba(209,159,40,0)", color: "#fbf7ef", duration: 0.25 }, fin);
    tl.to(".pin .dot", { scale: 1.25, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, fin);

    // Exit
    tl.to("#map-card", { scale: 0, rotation: 6, duration: 0.35, ease: "back.in(1.6)" }, 7.95);
    window.__timelines["map"] = tl;
  </script>
